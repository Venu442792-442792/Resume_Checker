version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: resume-screening-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_screening
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - resume_screening_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: resume-screening-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/resume_screening
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-super-secret-key-in-production-change-this-too
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      NLP_SERVICE_URL: http://nlp-service:8000
      FILE_UPLOAD_DIR: /app/uploads/resumes
    ports:
      - "8080:8080"
    volumes:
      - resume_screening_uploads:/app/uploads/resumes

  # nlp-service:
  #   build:
  #     context: ./nlp-service
  #   container_name: resume-screening-nlp
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   # Uncommented and wired up once the NLP service is generated.

  frontend:
    build:
      context: ./frontend
    container_name: resume-screening-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"

volumes:
  resume_screening_pgdata:
  resume_screening_uploads:
